# Publica FLOWI en Firebase Hosting (sitio flowi-gastos) cada vez que llega un cambio a main.
# También se puede lanzar a mano desde la pestaña Actions de GitHub ("Run workflow").
name: Publicar en Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dos publicaciones al mismo tiempo; la más reciente espera a que termine la anterior
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Probar el analizador de comandos de voz
        run: npm run test:voice

      - name: Compilar (exportación estática a out/)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Configuración web pública del proyecto propio de FLOWI (flowi-9af82): inicio de sesión y Firestore.
          # El sitio sigue alojado en tienda-38d40 (paso de publicación de abajo).
          # No son secretos: ya van incluidos en el JavaScript que se publica en el sitio.
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBjLK7qZ_2GOIJW-4oUEwnrU6sev21XJB4
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: flowi-9af82.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: flowi-9af82
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: flowi-9af82.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '501090670275'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:501090670275:web:1ebfd5841ec8afabc33476

      - name: Publicar en el sitio flowi-gastos
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIENDA_38D40 }}
          projectId: tienda-38d40
          target: flowi
          channelId: live
