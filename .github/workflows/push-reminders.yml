# Prueba manual de los recordatorios push.
# El envío real lo hace Firebase cada 5 minutos (función enviarRecordatorios en functions/index.js).
# Ya no corre con horario aquí: GitHub atrasaba la tarea varias horas y se perdían avisos.
name: Enviar recordatorios push (manual)

on:
  workflow_dispatch:

concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - name: Enviar los avisos que tocan
        run: node push/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLOWI }}
