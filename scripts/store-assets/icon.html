<!doctype html>
<!-- Genera los íconos de FLOWI: abrir con ?size=512&mode=any|maskable|play (lo usa scripts/store-assets/make.sh) -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
  const q = new URLSearchParams(location.search);
  const size = +(q.get('size') || 512);
  const mode = q.get('mode') || 'any';   // any: cuadro redondeado con fondo transparente · maskable / play: cuadro completo
  const BG = '#0F1729';
  // Logo en una caja de 100 (centro en 50,50); escala según el modo
  const scale = mode === 'maskable' ? 0.62 : mode === 'play' ? 0.74 : 0.78;
  const logo = `
    <g transform="translate(50 50) scale(${scale}) translate(-50 -50)" stroke-linecap="round" stroke-width="14">
      <line x1="28" y1="25" x2="28" y2="75" stroke="#06B6D4"/>
      <line x1="28" y1="25" x2="60" y2="25" stroke="#10B981"/>
      <line x1="28" y1="50" x2="48" y2="50" stroke="#2DD4BF"/>
      <circle cx="72" cy="50" r="7" fill="#F97316" stroke="none"/>
    </g>`;
  const bg = mode === 'any'
    ? `<rect x="4" y="4" width="92" height="92" rx="22" fill="${BG}"/>`
    : `<rect x="0" y="0" width="100" height="100" fill="${BG}"/>`;
  const s = document.getElementById('s');
  s.setAttribute('width', size); s.setAttribute('height', size); s.setAttribute('viewBox', '0 0 100 100');
  s.style.display = 'block';
  s.innerHTML = bg + logo;
</script>
</body></html>
